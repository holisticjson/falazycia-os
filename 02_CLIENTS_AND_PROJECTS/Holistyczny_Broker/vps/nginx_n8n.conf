# Nginx Reverse Proxy Server Block for n8n.holistycznybroker.pl
# Location: /etc/nginx/sites-available/n8n.holistycznybroker.pl

server {
    listen 80;
    server_name n8n.holistycznybroker.pl;

    # Przekierowanie całego ruchu HTTP na HTTPS (po wygenerowaniu certyfikatu Certbot)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name n8n.holistycznybroker.pl;

    # Certyfikaty SSL (Zostaną automatycznie wdrożone i nadpisane przez Certbota)
    # ssl_certificate /etc/letsencrypt/live/n8n.holistycznybroker.pl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/n8n.holistycznybroker.pl/privkey.pem;
    
    # Parametry bezpieczeństwa SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Nagłówki bezpieczeństwa (HSTS, XSS protection, clickjacking prevention)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Logi Nginx
    access_log /var/log/nginx/n8n_access.log;
    error_log /var/log/nginx/n8n_error.log;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Obsługa WebSockets (Kluczowe dla n8n - live UI updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400;
        
        # Zwiększenie limitu wysyłanych plików (przydatne przy wgrywaniu dużych bibliotek węzłów lub plików)
        client_max_body_size 50M;
    }
}
