steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/falazycia-os/swiatynia-harmonii', '-f', 'Dockerfile.swiatynia', '.']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: ['run', 'deploy', 'swiatynia-harmonii', '--image', 'gcr.io/falazycia-os/swiatynia-harmonii', '--region', 'europe-west1', '--platform', 'managed', '--allow-unauthenticated']
images:
- 'gcr.io/falazycia-os/swiatynia-harmonii'
