steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/falazycia-os/fala-zycia-web', '-f', 'Dockerfile.web', '.']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: ['run', 'deploy', 'fala-zycia-web', '--image', 'gcr.io/falazycia-os/fala-zycia-web', '--region', 'europe-west1', '--platform', 'managed', '--allow-unauthenticated']
images:
- 'gcr.io/falazycia-os/fala-zycia-web'
