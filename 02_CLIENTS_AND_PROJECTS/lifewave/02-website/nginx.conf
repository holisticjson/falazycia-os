map $http_x_forwarded_host $effective_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

map $effective_host $landing_page {
    default                                 /index.html;
    ~*app\.                                 redirect_dashboard;
    ~*jaison\.                              /jaison-landing.html;
    ~*ania\.                                /ania-landing.html;
    ~*monika\.                              /monika-landing.html;
    ~*grazyna\.                             /grazyna-landing.html;
    ~*swiatynia[-_]?harmonii                /swiatyniaharmonii-landing.html;
}

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Handle app.fala-zycia.pl redirect directly to Cloud Run Streamlit App
    location = /redirect_dashboard {
        return 302 https://fala-zycia-dashboard-194182220831.europe-central2.run.app;
    }

    location = / {
        if ($landing_page = "redirect_dashboard") {
            return 302 https://fala-zycia-dashboard-194182220831.europe-central2.run.app;
        }
        try_files $landing_page =404;
    }

    location / {
        if ($landing_page = "redirect_dashboard") {
            return 302 https://fala-zycia-dashboard-194182220831.europe-central2.run.app;
        }
        try_files $uri $uri/ $landing_page;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
