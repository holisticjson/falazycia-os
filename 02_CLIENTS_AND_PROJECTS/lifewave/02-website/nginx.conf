map $http_x_forwarded_host $effective_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

map $effective_host $landing_page {
    default                                 /index.html;
    ~*app\.                                 @dashboard_proxy;
    ~*jaison\.                              /jaison-landing.html;
    ~*ania\.                                /ania-landing.html;
    ~*monika\.                              /monika-landing.html;
    ~*grazyna\.                             /grazyna-landing.html;
    ~*swiatynia[-_]?harmonii                /swiatyniaharmonii-landing.html;
}

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Transparent proxy to Streamlit Dashboard so URL stays app.fala-zycia.pl
    location @dashboard_proxy {
        proxy_pass https://fala-zycia-dashboard-194182220831.europe-central2.run.app;
        proxy_set_header Host fala-zycia-dashboard-194182220831.europe-central2.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = / {
        if ($landing_page = "@dashboard_proxy") {
            error_page 418 = @dashboard_proxy;
            return 418;
        }
        try_files $landing_page =404;
    }

    location / {
        if ($landing_page = "@dashboard_proxy") {
            error_page 418 = @dashboard_proxy;
            return 418;
        }
        try_files $uri $uri/ $landing_page;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
