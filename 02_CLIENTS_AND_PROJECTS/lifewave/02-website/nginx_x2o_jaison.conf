# ==============================================================================
# GOTOWA KONFIGURACJA NGINX DLA SUBDOMENY x2o.jaison.pl (ODWROTNE PROXY)
# Lokalizacja pliku na serwerze VPS: /etc/nginx/sites-available/x2o.jaison.pl
# ==============================================================================
#
# INSTRUKCJA WDROŻENIA NA VPS:
# 1. Zaloguj się na swój VPS przez SSH.
# 2. Utwórz lub edytuj plik konfiguracyjny:
#    sudo nano /etc/nginx/sites-available/x2o.jaison.pl
# 3. Wklej poniższą treść i zapisz (Ctrl+O, Enter, Ctrl+X).
# 4. Podmień adres URL w dyrektywach:
#    - proxy_pass (np. https://jaison-x2o-portal-xxxxxx.a.run.app/)
#    - proxy_set_header Host (np. jaison-x2o-portal-xxxxxx.a.run.app)
# 5. Utwórz dowiązanie symboliczne:
#    sudo ln -s /etc/nginx/sites-available/x2o.jaison.pl /etc/nginx/sites-enabled/
# 6. Przetestuj konfigurację Nginx:
#    sudo nginx -t
# 7. Przeładuj serwer Nginx:
#    sudo systemctl reload nginx
# 8. Wygeneruj certyfikat SSL za pomocą Certbota:
#    sudo certbot --nginx -d x2o.jaison.pl
#
# ==============================================================================

server {
    listen 80;
    server_name x2o.jaison.pl;
    
    # Automatyczne przekierowanie HTTP na bezpieczny HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name x2o.jaison.pl;

    # Ścieżki do certyfikatów SSL (Let's Encrypt Certbot - zostaną dodane automatycznie)
    ssl_certificate /etc/letsencrypt/live/x2o.jaison.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x2o.jaison.pl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # GŁÓWNY PORTAL JAISON X2O (Działający na bezstanowym kontenerze Google Cloud Run)
    location / {
        # UWAGA: Podmień poniższy URL na adres wygenerowany przez deploy_cloud_run.ps1
        proxy_pass https://jaison-x2o-portal-771359551342.europe-central2.run.app/;
        
        # Wymagane nagłówki dla prawidłowej autoryzacji i routingu Cloud Run
        proxy_set_header Host jaison-x2o-portal-771359551342.europe-central2.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Obsługa ewentualnego WebSocket i długa tolerancja czasu bezczynności
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        
        # Standardowa wielkość przesyłanego body (np. formularze kontaktowe / pliki)
        client_max_body_size 10M;
    }
}
