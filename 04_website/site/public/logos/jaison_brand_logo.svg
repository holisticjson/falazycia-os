<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for High-End Gradients and Filters -->
  <defs>
    <!-- Cyber Neon Cyan to Royal Blue -->
    <linearGradient id="neonCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    
    <!-- Neon Gold/Orange for accents -->
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Deep Space Background Glow -->
    <radialGradient id="cyberGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for intense glowing text -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Futuristic Background Glow -->
  <circle cx="250" cy="225" r="200" fill="url(#cyberGlow)" />

  <!-- Outer Technological Ring -->
  <circle cx="250" cy="225" r="180" fill="none" stroke="rgba(6, 182, 212, 0.08)" stroke-width="1.5" stroke-dasharray="8 4" />
  <circle cx="250" cy="225" r="160" fill="none" stroke="rgba(99, 102, 241, 0.04)" stroke-width="1" />

  <!-- Central Brand Symbol: The J(AI)SON Agent Core -->
  <g transform="translate(0, -15)">
    <!-- Circuit lines in the background -->
    <path d="M 180 240 L 210 240 L 230 210 L 270 210 L 290 240 L 320 240" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="2" />
    <path d="M 210 210 L 250 170 L 290 210" fill="none" stroke="rgba(6, 182, 212, 0.1)" stroke-width="1.5" />
    
    <!-- Left parenthesis gesture / wing '(' styled as sleek cyan wing -->
    <path d="M 195 160 C 160 200 160 280 195 320" 
          fill="none" stroke="url(#neonCyanBlue)" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)" />
          
    <!-- Right parenthesis gesture / wing ')' styled as sleek cyan wing -->
    <path d="M 305 160 C 340 200 340 280 305 320" 
          fill="none" stroke="url(#neonCyanBlue)" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)" />

    <!-- Central Glowing Core - The "AI Mind" (Stylized neural/circuit sphere) -->
    <circle cx="250" cy="240" r="32" fill="#0A0F1D" stroke="url(#neonCyanBlue)" stroke-width="3" filter="url(#neonGlow)" />
    
    <!-- Floating particles around the core (autonomous workers) -->
    <circle cx="250" cy="240" r="45" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1" stroke-dasharray="10 30">
      <animateTransform attributeName="transform" type="rotate" from="0 250 240" to="360 250 240" dur="12s" repeatCount="indefinite" />
    </circle>
    
    <!-- Glowing neon inner core -->
    <circle cx="250" cy="240" r="12" fill="url(#neonGold)" />
    
    <!-- Small pulsing node at the top of the core -->
    <circle cx="250" cy="195" r="4" fill="#FFFFFF" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <!-- Central connection nodes -->
    <circle cx="195" cy="240" r="4" fill="#06B6D4" />
    <circle cx="305" cy="240" r="4" fill="#6366F1" />
  </g>

  <!-- Typography with Custom Layout -->
  <!-- Main Brand Name: J(AI)SON with highlighted 'AI' -->
  <text x="250" y="420" text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="34" fill="#FFFFFF" letter-spacing="2">
    J<tspan fill="#06B6D4" font-weight="800">(</tspan><tspan fill="#06B6D4" font-weight="900" filter="url(#neonGlow)">AI</tspan><tspan fill="#06B6D4" font-weight="800">)</tspan>SON
  </text>
  
  <!-- Sub-label: Platform/Architecture -->
  <text x="250" y="450" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#94A3B8" letter-spacing="5" opacity="0.8">
    AGENTIC OS &amp; B2B SYSTEMS
  </text>

  <!-- Tagline: Low Cost, Low Friction, Secure, Zero Leakage -->
  <text x="250" y="472" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="8.5" fill="#F59E0B" letter-spacing="1.5" opacity="0.6">
    LOW COST • LOW FRICTION • SECURE • ZERO DATA LEAKAGE
  </text>
</svg>
