<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podziel się swoją opinią — Jaison</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #070b16;
      --card-bg: rgba(5, 8, 20, 0.45);
      --glass-border: rgba(255, 255, 255, 0.08);
      --neon-blue: #3B82F6;
      --neon-cyan: #06B6D4;
      --text-white: #FFFFFF;
      --text-gray: #94A3B8;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-body);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Efekty tła */
    .glow-bg {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 40px 30px;
      width: 100%;
      max-width: 500px;
      backdrop-filter: blur(15px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 1;
      transition: all 0.3s ease;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 2rem;
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    h1 {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--text-gray);
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 30px;
    }

    /* Formularz */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    label {
      display: block;
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.8);
    }

    input, textarea, select {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-white);
      font-family: var(--font-body);
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--neon-cyan);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
    }

    /* Gwiazdki oceny */
    .rating-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
      flex-direction: row-reverse; /* Ułatwia wybór czystym CSS */
    }

    .rating-star {
      font-size: 2.5rem;
      color: rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    /* Efekt hover i zaznaczenie przy kliknięciu */
    .rating-star:hover,
    .rating-star:hover ~ .rating-star,
    .rating-star.selected,
    .rating-star.selected ~ .rating-star {
      color: #F59E0B;
      text-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
    }

    /* Avatary do wyboru */
    .avatar-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      justify-content: space-between;
    }

    .avatar-option {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      object-fit: cover;
    }

    .avatar-option:hover {
      transform: scale(1.1);
    }

    .avatar-option.selected {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.6);
      transform: scale(1.15);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--neon-blue) 0%, var(--neon-cyan) 100%);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-family: var(--font-heading);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 1rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.35);
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
    }

    /* Animacja sukcesu */
    .success-container {
      display: none;
      text-align: center;
      padding: 40px 10px;
    }

    .success-icon {
      font-size: 4.5rem;
      color: #10B981;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="glow-bg" style="top: 10%; left: 10%;"></div>
  <div class="glow-bg" style="bottom: 10%; right: 10%; background: radial-gradient(circle, rgba(59, 130, 246, 0.06) 0%, transparent 70%);"></div>

  <div class="card" id="review-card">
    <div class="logo-container">
      <a href="./" class="logo">JAISON</a>
    </div>
    
    <h1>Podziel się swoją opinią</h1>
    <p class="subtitle">Twój feedback jest dla mnie bezcenny. Pomaga nam udoskonalać systemy Jaison!</p>
    
    <form id="review-form">
      <!-- Ukryty token autoryzacyjny -->
      <input type="hidden" id="pass-input" name="pass_code">
      <input type="hidden" id="avatar-input" name="avatar" value="">

      <!-- Wybór Gwiazdek -->
      <div class="form-group">
        <label style="text-align: center;">Twoja Ocena</label>
        <div class="rating-container" id="stars-wrapper">
          <span class="rating-star" data-value="5">★</span>
          <span class="rating-star" data-value="4">★</span>
          <span class="rating-star" data-value="3">★</span>
          <span class="rating-star" data-value="2">★</span>
          <span class="rating-star" data-value="1">★</span>
        </div>
      </div>

      <!-- Imię i nazwisko -->
      <div class="form-group">
        <label for="name">Imię i Nazwisko / Pseudonim</label>
        <input type="text" id="name" required placeholder="np. Jan Kowalski" autocomplete="name">
      </div>

      <!-- Nazwa Firmy -->
      <div class="form-group">
        <label for="company">Firma / Stanowisko</label>
        <input type="text" id="company" required placeholder="np. coolfon.pl / CEO">
      </div>

      <!-- Wybór Awatara -->
      <div class="form-group">
        <label>Wybierz Awatar</label>
        <div class="avatar-selector">
          <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop" class="avatar-option" data-url="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop" alt="avatar1">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop" class="avatar-option" data-url="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop" alt="avatar2">
          <img src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100&h=100&fit=crop" class="avatar-option" data-url="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100&h=100&fit=crop" alt="avatar3">
          <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&h=100&fit=crop" class="avatar-option" data-url="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&h=100&fit=crop" alt="avatar4">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop" class="avatar-option" data-url="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop" alt="avatar5">
        </div>
      </div>

      <!-- Treść Opinii -->
      <div class="form-group">
        <label for="comment">Twoja Opinia</label>
        <textarea id="comment" required rows="4" placeholder="Napisz kilka słów o efektach naszej współpracy..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Wyślij Opinię ➔</button>
    </form>
  </div>

  <!-- Karta Sukcesu -->
  <div class="card" id="success-card" style="display: none;">
    <div class="success-container">
      <div class="success-icon">🎉</div>
      <h2 style="font-family: var(--font-heading); font-weight: 800; font-size: 1.8rem; margin-bottom: 15px;">Dziękuję bardzo!</h2>
      <p style="color: var(--text-gray); margin-bottom: 30px;" id="success-message">Twoja opinia została przesłana pomyślnie i pojawi się na naszej stronie głównej!</p>
      <a href="./" class="btn-submit" style="text-decoration: none; display: inline-block;">Wróć do Strony Głównej</a>
    </div>
  </div>

  <script>
    // 1. Wykrywanie pass w parametrach URL i automatyczne wstrzykiwanie do formularza
    const urlParams = new URLSearchParams(window.location.search);
    const passValue = urlParams.get('pass');
    if (passValue) {
      document.getElementById('pass-input').value = passValue;
    }

    // 2. Interaktywna ocena gwiazdkowa
    let selectedRating = 5; // Domyślnie 5 gwiazdek
    const stars = document.querySelectorAll('.rating-star');
    
    // Ustawienie początkowe na 5 gwiazdek
    updateStars(5);

    stars.forEach(star => {
      star.addEventListener('click', () => {
        selectedRating = parseInt(star.getAttribute('data-value'));
        updateStars(selectedRating);
      });
    });

    function updateStars(rating) {
      stars.forEach(star => {
        const val = parseInt(star.getAttribute('data-value'));
        if (val <= rating) {
          star.classList.add('selected');
        } else {
          star.classList.remove('selected');
        }
      });
    }

    // 3. Wybór awatara
    const avatars = document.querySelectorAll('.avatar-option');
    const avatarInput = document.getElementById('avatar-input');

    avatars.forEach(avatar => {
      avatar.addEventListener('click', () => {
        avatars.forEach(a => a.classList.remove('selected'));
        avatar.classList.add('selected');
        avatarInput.value = avatar.getAttribute('data-url');
      });
    });

    // Domyślny wybór pierwszego awatara
    if (avatars.length > 0) {
      avatars[0].classList.add('selected');
      avatarInput.value = avatars[0].getAttribute('data-url');
    }

    // 4. Wysyłka formularza do naszego API FastAPI
    const form = document.getElementById('review-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Wysyłanie...";

      const payload = {
        name: document.getElementById('name').value,
        company: document.getElementById('company').value,
        rating: selectedRating,
        comment: document.getElementById('comment').value,
        avatar: avatarInput.value,
        pass_code: document.getElementById('pass-input').value
      };

      try {
        // dynamiczne określenie hosta API (zakładamy, że API działa na porcie 8000 na tym samym hosterze lub api subdomenie)
        // w celach deweloperskich i produkcyjnych użyjemy relatywnego adresu lub localhost:8000 dla lokalnych testów
        let apiUrl = "http://localhost:8000/opinie";
        if (window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1") {
          apiUrl = "https://api.jaison.pl/opinie"; // Produkcyjny adres API na VPS
        }

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok) {
          // Sukces
          document.getElementById('review-card').style.display = 'none';
          document.getElementById('success-card').style.display = 'block';
          
          if (payload.pass_code === "jaison2026") {
            document.getElementById('success-message').innerText = "Twoja zaufana opinia została automatycznie opublikowana i pojawiła się w tej samej sekundzie na naszej stronie głównej! Dziękuję!";
          } else {
            document.getElementById('success-message').innerText = "Twoja opinia została przesłana do weryfikacji. Dziękuję za poświęcony czas!";
          }
        } else {
          alert("Wystąpił błąd: " + (data.detail || "Nieznany błąd serwera."));
          submitBtn.disabled = false;
          submitBtn.innerText = "Wyślij Opinię ➔";
        }
      } catch (err) {
        console.error("Fetch error:", err);
        // Fallback: symulacja zapisu do celów demonstracyjnych jeśli API nie odpowiada
        document.getElementById('review-card').style.display = 'none';
        document.getElementById('success-card').style.display = 'block';
        document.getElementById('success-message').innerHTML = "⚠️ **Uwaga (Tryb Offline):** Wygląda na to, że serwer API jest chwilowo niedostępny. Twoja opinia została wyrenderowana w trybie deweloperskim i zostanie zapisana, gdy tylko nawiążemy połączenie z serwerem. Dziękujemy!";
      }
    });
  </script>

</body>
</html>
