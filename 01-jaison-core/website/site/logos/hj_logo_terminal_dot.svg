<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Glow -->
  <circle cx="250" cy="250" r="220" fill="url(#glow)" />

  <!-- Outer Rounded Terminal Frame -->
  <rect x="100" y="80" width="300" height="300" rx="36" fill="rgba(10, 15, 29, 0.6)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="2" />
  <rect x="100" y="80" width="300" height="300" rx="36" fill="none" stroke="url(#platinumGrad)" stroke-width="1" stroke-opacity="0.3" />

  <!-- Monogram with brackets { HJ. } -->
  <g transform="translate(0, -10)">
    <!-- Curly Bracket Left { -->
    <path d="M165 170 C145 170 140 195 140 215 C140 235 130 240 125 240 C130 240 140 245 140 265 C140 285 145 310 165 310" 
          fill="none" stroke="url(#platinumGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- HJ Monogram -->
    <!-- Letter H -->
    <path d="M185 185 L185 295" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <path d="M225 185 L225 295" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <path d="M185 240 L225 240" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />

    <!-- Letter J -->
    <path d="M255 185 L255 275 C255 295 240 300 235 295" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />

    <!-- Curly Bracket Right } -->
    <path d="M295 170 C315 170 320 195 320 215 C320 235 330 240 335 240 C330 240 320 245 320 265 C320 285 315 310 295 310" 
          fill="none" stroke="url(#platinumGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Status Active Pulsing Green Dot (Cron Job active / Online) -->
    <circle cx="355" cy="120" r="12" fill="#10B981" fill-opacity="0.15">
      <animate attributeName="r" values="12;18;12" dur="2s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.15;0.35;0.15" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="355" cy="120" r="6" fill="url(#neonGreenGrad)" />
    <circle cx="355" cy="120" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="250" y="435" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#FFFFFF" letter-spacing="1">
    HOLISTIC J<tspan fill="#10B981">{</tspan>a<tspan fill="#10B981">}</tspan>SON
  </text>
  <text x="250" y="465" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#94A3B8" letter-spacing="4" opacity="0.7">
    PREMIUM MINIMALIST TERMINAL
  </text>
</svg>
