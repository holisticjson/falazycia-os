model_list:
  # === GEMINI TEXT MODELS ===
  - model_name: hermes-fast
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_project: holistic-dashboard-dev
      vertex_location: us-central1
      vertex_credentials: /home/holisticjson/gcp-sa-key.json
      rpm: 1000

  - model_name: hermes-think
    litellm_params:
      model: vertex_ai/gemini-2.5-pro
      vertex_project: holistic-dashboard-dev
      vertex_location: us-central1
      vertex_credentials: /home/holisticjson/gcp-sa-key.json
      rpm: 60

  # === IMAGEN IMAGE MODELS ===
  - model_name: hermes-image-fast
    litellm_params:
      model: vertex_ai/imagen-3.0-fast-generate-001
      vertex_project: holistic-dashboard-dev
      vertex_location: us-central1
      vertex_credentials: /home/holisticjson/gcp-sa-key.json

  - model_name: hermes-image
    litellm_params:
      model: vertex_ai/imagen-3.0-generate-001
      vertex_project: holistic-dashboard-dev
      vertex_location: us-central1
      vertex_credentials: /home/holisticjson/gcp-sa-key.json

  # === VEO VIDEO MODEL ===
  - model_name: hermes-video
    litellm_params:
      model: vertex_ai/veo-2.0-generate-001
      vertex_project: holistic-dashboard-dev
      vertex_location: us-central1
      vertex_credentials: /home/holisticjson/gcp-sa-key.json

router_settings:
  fallbacks:
    - hermes-fast:
        - hermes-think
  num_retries: 2
  retry_after: 5

general_settings:
  disable_database: true
  master_key: sk-hermes-local
