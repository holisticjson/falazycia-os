map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- os.holisticjson.pl --- Hermes Dashboard UI (v0.16.0+) ---
server {
    server_name os.holisticjson.pl;
    client_max_body_size 100M;

    # Basic Auth DISABLED - Hermes v0.16.0 uses its own session-token auth
    # auth_basic "Holistic OS - dostep chroniony";
    # auth_basic_user_file /etc/nginx/.htpasswd-hermes;

    # -- Webhook Systeme.io --
    location /hermes-api/webhooks/systeme-io {
        proxy_pass http://127.0.0.1:5001/hermes-api/webhooks/systeme-io;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -- Hermes Gateway API (REST + WebSocket) --
    location /hermes-api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        proxy_pass http://127.0.0.1:8642/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # -- OpenAI Compatible API --
    location /v1/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        proxy_pass http://127.0.0.1:8642/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -- Hermes Dashboard UI (v0.16.0 native - port 9119) --
    # NOTE: Host must be 127.0.0.1:9119 - Hermes v0.16.0 validates Host header
    # against its bind address. We use public_url in config.yaml instead.
    location / {
        proxy_pass         http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host               127.0.0.1:9119;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/os.holisticjson.pl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/os.holisticjson.pl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = os.holisticjson.pl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name os.holisticjson.pl;
    client_max_body_size 100M;
    return 404; # managed by Certbot
}
