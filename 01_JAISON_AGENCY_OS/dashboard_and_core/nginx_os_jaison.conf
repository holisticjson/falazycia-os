# ==============================================================================
# GOTOWA KONFIGURACJA NGINX DLA DOMENY os.jaison.pl (ODWROTNE PROXY)
# Lokalizacja pliku na serwerze VPS: /etc/nginx/sites-available/os.jaison.pl
# ==============================================================================
#
# INSTRUKCJA WDROŻENIA NA VPS:
# 1. Zaloguj się na swój VPS przez SSH.
# 2. Utwórz lub edytuj plik konfiguracyjny:
#    sudo nano /etc/nginx/sites-available/os.jaison.pl
# 3. Wklej poniższą treść i zapisz (Ctrl+O, Enter, Ctrl+X).
# 4. Utwórz dowiązanie symboliczne:
#    sudo ln -s /etc/nginx/sites-available/os.jaison.pl /etc/nginx/sites-enabled/
# 5. Przetestuj konfigurację Nginx:
#    sudo nginx -t
# 6. Przeładuj serwer Nginx:
#    sudo systemctl reload nginx
#
# ==============================================================================

server {
    listen 80;
    server_name os.jaison.pl;
    
    # Automatyczne wymuszenie bezpiecznego protokołu HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name os.jaison.pl;

    # Ścieżki do certyfikatów SSL (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/os.jaison.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/os.jaison.pl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. GŁÓWNY PANEL DASHBOARD (Streamlit działający na Google Cloud Run)
    location / {
        proxy_pass https://holistic-ceo-771359551342.europe-central2.run.app/;
        
        # Wymagane nagłówki dla prawidłowej autoryzacji i routingu Cloud Run
        proxy_set_header Host holistic-ceo-771359551342.europe-central2.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Obsługa WebSocket (Kluczowa dla działania Streamlit!)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # 2. PANEL SILNIKA HERMES OS (Działający lokalnie na VPS Port 9119)
    location /hermes/ {
        proxy_pass http://127.0.0.1:9119/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Obsługa WebSocket dla Hermesa
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # 3. BACKEND API (FastAPI / webhook_api.py - Działający lokalnie na VPS Port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
