    litellm_params:
      model: vertex_ai/gemini-3.5-pro

router_settings:
  routing_strategy: usage-based-routing-v2
  routing_strategy_args:
    ttl: 3600
  fallbacks: [{"free-fast": ["free-fast"]}]

general_settings:
  disable_database: true
  master_key: "sk-hermes-local"
